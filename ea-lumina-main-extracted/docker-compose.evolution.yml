

services:
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - DOCKER_ENV=true
      - LOG_LEVEL=ERROR,WARN,DEBUG,INFO,LOG,VERBOSE,DARK,FATAL
      - AUTHENTICATION_API_KEY=sua-api-key-secreta
      - AUTH_API_KEY_WEBHOOK=sua-api-key-secreta
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:postgres@evolution-postgres:5432/evolution?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api
      - REDIS_ENABLED=false
      - REDIS_URI=redis://evolution-redis:6379
      - REDIS_PREFIX_KEY=evolution
      - RABBITMQ_ENABLED=false
      - WEBSOCKET_ENABLED=false
      - WA_BUSINESS_API_ENABLED=false
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    networks:
      - evolution-network
    restart: always

  evolution-postgres:
    image: postgres:15
    container_name: evolution-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=evolution
    ports:
      - "5433:5432"
    volumes:
      - evolution-postgres-data:/var/lib/postgresql/data
    networks:
      - evolution-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  evolution-redis:
    image: redis:7
    container_name: evolution-redis
    ports:
      - "6380:6379"
    volumes:
      - evolution-redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - evolution-network
    restart: always

volumes:
  evolution-postgres-data:
  evolution-redis-data:

networks:
  evolution-network:
    driver: bridge
